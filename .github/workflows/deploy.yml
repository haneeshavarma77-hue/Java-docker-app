name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token request
  contents: read    # required to check out the repo

env:
  AWS_REGION: ap-south-1

  # Single ECR repo — both images pushed with tag prefixes
  ECR_REPO: ${{ secrets.ECR_REPO_URI }}  # e.g. 123456789.dkr.ecr.ap-south-1.amazonaws.com/java-app

  # Single ECS cluster + service that runs both containers in one task
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_ARN }}  # cluster ARN or name
  ECS_SERVICE:  ${{ secrets.ECS_SERVICE_ARN }}  # service ARN or name

  # Task definition family name — change to match yours in ECS
  TASK_DEF_FAMILY: java-app-task

  # Container names inside the task definition
  CONTAINER_NAME_API:      java-api
  CONTAINER_NAME_FRONTEND: java-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & push API image (Spring Boot)
  # ─────────────────────────────────────────────────────────────────────────
  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile \
            --target api \
            --tag $ECR_REPO:api-$IMAGE_TAG \
            --tag $ECR_REPO:api-latest \
            .
          docker push $ECR_REPO:api-$IMAGE_TAG
          docker push $ECR_REPO:api-latest
          echo "image=$ECR_REPO:api-$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & push Frontend image (Nginx)
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Frontend image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile \
            --target frontend \
            --tag $ECR_REPO:frontend-$IMAGE_TAG \
            --tag $ECR_REPO:frontend-latest \
            .
          docker push $ECR_REPO:frontend-$IMAGE_TAG
          docker push $ECR_REPO:frontend-latest
          echo "image=$ECR_REPO:frontend-$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy both containers to the single ECS service
  #
  # Both containers share the task network namespace (awsvpc), so the
  # Nginx frontend proxies to the Spring Boot API via localhost:8080.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-frontend

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_DEF_FAMILY \
            --query taskDefinition \
            > task-def.json

      - name: Render task definition — update API container image
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME_API }}
          image: ${{ needs.build-api.outputs.image }}

      - name: Render task definition — update Frontend container image + API host
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          # Chain from previous render so both container updates are present
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_NAME_FRONTEND }}
          image: ${{ needs.build-frontend.outputs.image }}
          # Both containers share the task network namespace in ECS (awsvpc),
          # so Nginx reaches the Spring Boot API over localhost.
          environment-variables: |
            API_HOST=localhost
            API_PORT=8080

      - name: Deploy updated task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
